name: CI

on:
  push:
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@v2
      - name: Check tracked sensitive files
        run: python scripts/check_repo.py sensitive

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Test backend
        run: python -m pytest -q
      - name: Compile and statically check Python
        run: python -m compileall -q backend/app
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend install
      - name: Test frontend
        run: npm --prefix frontend test
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Lint repository
        run: make lint
      - name: Check documentation links and repository secrets
        run: make security
      - name: Audit Python environment
        run: python -m pip check
      - name: Audit npm dependencies
        run: npm --prefix frontend audit --audit-level=high
